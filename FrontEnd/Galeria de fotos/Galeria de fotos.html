<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galeria de Fotos</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <h1>Mi Álbum de Fotos</h1>
</header>

<div class="contenedor">

    <div class="subir">
        <h2>Subir Nueva Foto</h2>
        <form>
            <label>Seleccionar Imagen:</label>
            <input type="file">

            <label>Descripción:</label>
            <textarea rows="3" placeholder="Escribe una descripción..."></textarea>

            <button type="submit">Subir Foto</button>
        </form>
    </div>

    <div class="album">

        <div class="tarjeta">
            <img src="foto1.jpg" alt="Foto 1">
            <div class="contenido">
                <p>Atardecer en la playa.</p>
            </div>
        </div>

        <div class="tarjeta">
            <img src="foto2.jpg" alt="Foto 2">
            <div class="contenido">
                <p>Cenando con lujo.</p>
            </div>
        </div>

        <div class="tarjeta">
            <img src="foto3.jpg" alt="Foto 3">
            <div class="contenido">
                <p>Ciudad iluminada por la noche.</p>
            </div>
        </div>

        <div class="tarjeta">
            <img src="foto4.jpg" alt="Foto 4">
            <div class="contenido">
                <p>Día familiar.</p>
            </div>
        </div>

    </div>

</div>

</body>
</html>
