<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reseñas del Lugar</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    Deja tu Reseña
</header>

<div class="contenedor">

    <div class="reseña">
        <h2>Escribe tu opinión sobre el lugar</h2>

        <form>
            <label>Nombre:</label>
            <input type="text" placeholder="Ingresa tu nombre">

            <label>Fecha:</label>
            <input type="date">

            <label>Calificación:</label>
            <select>
                <option>1 - Muy malo</option>
                <option>2 - Malo</option>
                <option>3 - Regular</option>
                <option>4 - Bueno</option>
                <option>5 - Excelente</option>
            </select>

            <label>Comentario:</label>
            <textarea rows="4" placeholder="Escribe tu reseña aquí..."></textarea>

            <button type="submit">Enviar Reseña</button>
        </form>
    </div>

</div>

</body>
</html>
